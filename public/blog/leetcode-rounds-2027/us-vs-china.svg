<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Interview practices, US versus China. Live technical interviews 79 and 87 percent. Allow AI use 38 and 68. Automated code tests 63 and 49. Take-home projects 45 and 20.">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#737376}.s{fill:#111;font-weight:500}</style>
  <rect width="520" height="300" rx="12" fill="#ffffff"/>
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#6b75f0"/><text x="16" y="10">US</text>
    <rect x="56" y="0" width="10" height="10" rx="2" fill="#e0a56b"/><text x="72" y="10">China</text>
    <g transform="translate(0 30)">
      <text x="0" y="32" class="s">Live technical interviews</text>
      <rect x="180" y="10" width="205" height="16" fill="#6b75f0" rx="2"/><text x="391" y="23">79%</text>
      <rect x="180" y="28" width="226" height="16" fill="#e0a56b" rx="2"/><text x="412" y="41">87%</text>
      <text x="0" y="92" class="s">Allow AI use</text>
      <rect x="180" y="70" width="99" height="16" fill="#6b75f0" rx="2"/><text x="285" y="83">38%</text>
      <rect x="180" y="88" width="177" height="16" fill="#e0a56b" rx="2"/><text x="363" y="101">68%</text>
      <text x="0" y="152" class="s">Automated code tests</text>
      <rect x="180" y="130" width="164" height="16" fill="#6b75f0" rx="2"/><text x="350" y="143">63%</text>
      <rect x="180" y="148" width="127" height="16" fill="#e0a56b" rx="2"/><text x="313" y="161">49%</text>
      <text x="0" y="212" class="s">Take-home projects</text>
      <rect x="180" y="190" width="117" height="16" fill="#6b75f0" rx="2"/><text x="303" y="203">45%</text>
      <rect x="180" y="208" width="52" height="16" fill="#e0a56b" rx="2"/><text x="238" y="221">20%</text>
    </g>
  </g>
</svg>
