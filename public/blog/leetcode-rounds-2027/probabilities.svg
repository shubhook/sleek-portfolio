<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 376" role="img" aria-label="Estimated probabilities for events by October 2027.">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#737376}.s{fill:#111;font-weight:500}</style>
  <rect width="520" height="376" rx="12" fill="#ffffff"/>
  <g transform="translate(20 20)">
    <text x="0" y="14" class="s">OAs stay the first filter for big-tech new grads</text>
    <rect x="0" y="20" width="324" height="14" fill="#6b75f0" rx="2"/><text x="330" y="32">90%</text>
    <text x="0" y="60" class="s">3+ of big five run an AI-assisted round</text>
    <rect x="0" y="66" width="252" height="14" fill="#6b75f0" rx="2"/><text x="258" y="78">70%</text>
    <text x="0" y="106" class="s">Another big-five firm adds in-person finals</text>
    <rect x="0" y="112" width="216" height="14" fill="#6b75f0" rx="2"/><text x="222" y="124">60%</text>
    <text x="0" y="152" class="s">Google expands its AI-assisted pilot</text>
    <rect x="0" y="158" width="198" height="14" fill="#6b75f0" rx="2"/><text x="204" y="170">55%</text>
    <text x="0" y="198" class="s">One big-five firm drops DSA for all SWE levels</text>
    <rect x="0" y="204" width="54" height="14" fill="#6b75f0" rx="2"/><text x="60" y="216">15%</text>
    <text x="0" y="244" class="s">Indian IT services drop DSA/aptitude OAs</text>
    <rect x="0" y="250" width="18" height="14" fill="#6b75f0" rx="2"/><text x="24" y="262">5%</text>
    <text x="0" y="290" class="s">Pure DSA rounds gone at all big five</text>
    <rect x="0" y="296" width="11" height="14" fill="#6b75f0" rx="2"/><text x="17" y="308">3%</text>
  </g>
</svg>
