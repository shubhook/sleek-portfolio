<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="The two-PR loop for one Helm task. 1, spec PR with the task file, interface stubs and tests marked ignore. 2, review and merge. 3, implementation PR that fills in the stubs and deletes only the ignore lines. 4, CI gates. 5, review and merge.">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#737376}.s{fill:#111;font-weight:500}</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#737376"/>
    </marker>
  </defs>
  <rect width="480" height="380" rx="12" fill="#ffffff"/>
  <g transform="translate(0 10)">
    <rect x="40" y="8" width="400" height="56" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="240" y="31" text-anchor="middle" class="s">1. Spec PR</text>
    <text x="240" y="51" text-anchor="middle">task file, interface stubs, tests marked #[ignore]</text>
    <line x1="240" y1="64" x2="240" y2="84" stroke="#737376" marker-end="url(#ah)"/>
    <rect x="40" y="88" width="400" height="56" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="240" y="111" text-anchor="middle" class="s">2. Review and merge</text>
    <text x="240" y="131" text-anchor="middle">I read the spec and tests, then add the label</text>
    <line x1="240" y1="144" x2="240" y2="164" stroke="#737376" marker-end="url(#ah)"/>
    <rect x="40" y="168" width="400" height="56" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="240" y="191" text-anchor="middle" class="s">3. Implementation PR</text>
    <text x="240" y="211" text-anchor="middle">fills in the stubs, deletes only the #[ignore] lines</text>
    <line x1="240" y1="224" x2="240" y2="244" stroke="#737376" marker-end="url(#ah)"/>
    <rect x="40" y="248" width="400" height="56" rx="6" fill="#ffffff" stroke="#6b75f0" stroke-width="2"/>
    <text x="240" y="271" text-anchor="middle" class="s">4. CI gates</text>
    <text x="240" y="291" text-anchor="middle">fmt, clippy, tests, deny, bench vs base, protected paths</text>
    <line x1="240" y1="304" x2="240" y2="324" stroke="#737376" marker-end="url(#ah)"/>
    <text x="240" y="348" text-anchor="middle" class="s">5. Review and merge</text>
  </g>
</svg>
